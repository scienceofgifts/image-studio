<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#44403c" stroke-width="2" />
  
  <!-- Inner Amber Border -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Central Emblem: Isometric Gift Box + Radiant Sparkle -->
  <g transform="translate(12, 12)">
    <!-- Base Gift Box Structure -->
    <path d="M 6,16 L 20,8 L 34,16 L 34,34 L 20,42 L 6,34 Z" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Ribbon Construction Lines -->
    <path d="M 20,8 L 20,25" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 6,16 L 20,25 L 34,16" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 20,25 L 20,42" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- Radiant Sparkle at Top -->
    <path d="M 20,1 L 22,6 L 27,8 L 22,10 L 20,15 L 18,10 L 13,8 L 18,6 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="20" cy="8" r="1.5" fill="#ffffff" />
  </g>
</svg>
