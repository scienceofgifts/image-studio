<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0f0e0d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Background Rounded Square */}
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#57534e" stroke-width="3" filter="url(#shadow)" />
  
  {/* Inner Golden Bezel Line */}
  <rect x="10" y="10" width="108" height="108" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />

  {/* Central Emblem Group */}
  <g transform="translate(24, 24)">
    {/* Isometric Gift Box Body */}
    <path d="M 12,32 L 40,16 L 68,32 L 68,72 L 40,88 L 12,72 Z" fill="url(#boxGrad)" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" />
    
    {/* Left Face shading / detail */}
    <path d="M 12,32 L 40,48 L 40,88 L 12,72 Z" fill="#ffffff" fill-opacity="0.04" />

    {/* Ribbon Vertical & Horizontal Lines */}
    <path d="M 40,16 L 40,54" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 12,32 L 40,50 L 68,32" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 40,50 L 40,88" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    {/* Radiant 8-Point Star Sparkle at Top */}
    <g transform="translate(40, 10)">
      <path d="M 0,-14 C 2,-4 4,-2 14,0 C 4,2 2,4 0,14 C -2,4 -4,2 -14,0 C -4,-2 -2,-4 0,-14 Z" fill="url(#goldGrad)" filter="url(#glow)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>
